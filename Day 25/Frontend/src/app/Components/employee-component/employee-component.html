<!DOCTYPE html>
<html>

<head>
    <meta charset="ISO-8859-1">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>
    <div class="header">
        <h1>Employee Management System</h1>
    </div>
    <br>
    <form #employeeForm="ngForm">
        <div class="content">
            <table>
                <tr>
                    <td>Employee ID:</td>
                    <td><input type="text" name='empId' id="empId" #empId="ngModel" ngModel></td>
                </tr>
                <tr>
                    <td>Employee Name:</td>
                    <td><input type="text" name='empName' id="empName" #empName="ngModel" ngModel></td>
                </tr>

                <tr>
                    <td>Employee Email:</td>
                    <td><input type="text" name='email' id="email" #email="ngModel" ngModel></td>
                </tr>

                <tr>
                    <td>Employee Salary:</td>
                    <td><input type="text" name='empSalary' id="empSalary" #empSalary="ngModel" ngModel></td>
                </tr>
                <tr>
                    <td>Department Number:</td>
                    <td><input type="text" name='deptNo' id="deptNo" #deptNo="ngModel" ngModel></td>
                </tr>
            </table>
            <br>
            <button type="button" class="btn btn-primary"
                (click)="saveEmployee(employeeForm.value)">Insert</button>&nbsp;&nbsp;
            <input type="submit" value="Delete" class="btn-danger"
                (click)="deleteEmployee(employeeForm.value)">&nbsp;&nbsp;
            <input type="submit" value="Update" class="btn-success"
                (click)="updateEmployee(employeeForm.value)">&nbsp;&nbsp;
            <input type="submit" value="Find" class="btn-info"
            (click) = "find()">&nbsp;&nbsp;
            <input type="submit" value="FindAll" class="btn-warning"
            (click) = "findAll()">&nbsp;&nbsp;
            <br>
        </div>
    </form>

    <h1 class="alert alert-info">{{result}}</h1>
</body>

</html>
