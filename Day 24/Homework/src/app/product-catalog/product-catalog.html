<h2>Product List</h2>

<table border="1">
    <tr>
        <th>Product Id</th>
        <th>Product Name</th>
        <th>Category</th>
        <th>Price</th>
    </tr>

    <tr *ngFor="let product of products;">

        <td>{{ product.productId }}</td>
        <td>{{ product.productName }}</td>
        <td>{{ product.category }}</td>
        <td>{{ product.price }}</td>
    </tr>
</table>
