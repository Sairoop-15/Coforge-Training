spring.application.name=WB-PMS
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Embedded Tomcat Port Number
server.port=1111

eureka.instance.hostname=localhost

#Stop registering as a client. It is a Server
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#DataBase Connection Properties

# Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/testdata

# Database Username
spring.datasource.username=root

# Database Password
spring.datasource.password=sairoop@1551

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Application Properties
pms.save.success=SUCCESS : Product Object Saved
pms.update.success=SUCCESS : Product Object Updated
pms.delete.success=SUCCESS : Product Object Deleted
pms.db.failed=Failed : DB Error

pms.invalid.notfound=Product Not Found!
pms.invalid.product-notfound=Product Not Found!
pms.invalid.product-details=Invalid Product Details!
